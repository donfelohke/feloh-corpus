# Lychee configuration for the ten-repository ecosystem audit.
# Exclude raw Jekyll/Liquid sources and Markdown files copied into the
# generated IKAI site; the rendered HTML pages remain in the audit.
max_concurrency = 4
timeout = 10
max_retries = 1
include_fragments = true
method = "get"

exclude_path = [
  "(^|/)repositories/Ikai/_layouts/",
  "(^|/)repositories/Ikai/wiki/",
  "(^|/)repositories/Ikai/index\\.html$",
  "(^|/)repositories/Ikai/_site/.*\\.md$",
]
